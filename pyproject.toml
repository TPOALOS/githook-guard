[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "githook-guard"
version = "1.1.0"
description = "One-command pre-commit hook that blocks secrets, sensitive files, oversized files and personal e-mail commits."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["git-hooks", "pre-commit", "secrets", "security", "devsecops"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/githook-guard"

[project.scripts]
githook-guard = "githook_guard:main"

[tool.setuptools]
py-modules = ["githook_guard"]
